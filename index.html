<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sub Goal</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Quicksand','Vazirmatn',Tahoma,sans-serif}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#wrap{position:absolute;left:40px;top:40px;width:640px;height:170px;z-index:10}
.glass{position:absolute;left:60px;top:22px;right:0;height:120px;border-radius:32px;
 background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(236,222,255,.68) 60%,rgba(255,225,248,.6));
 border:2.5px solid #fff;
 box-shadow:0 12px 36px rgba(110,60,190,.45),0 0 0 2px rgba(150,100,230,.35),inset 0 2px 0 #fff,inset 0 -10px 20px rgba(190,150,255,.3);overflow:hidden}
.glass::before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.55),transparent)}
.top{position:absolute;left:150px;right:30px;top:32px;display:flex;justify-content:space-between;align-items:baseline;color:#3a1670;z-index:2}
#title{font-size:26px;font-weight:700;letter-spacing:.12em;text-transform:lowercase}
#title .l{display:inline-block;animation:wave 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
@keyframes wave{0%,55%,100%{transform:translateY(0) scale(1);color:#3a1670}25%{transform:translateY(-9px) scale(1.18) rotate(-4deg);color:#c13dff;text-shadow:0 0 12px #ff9be0}}
#title.fast .l{animation-duration:.55s;animation-iteration-count:2}
#title::after{content:"✦";display:inline-block;margin-left:10px;color:#c13dff;animation:spin 3s linear infinite;text-shadow:0 0 10px #fff}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.45)}100%{transform:rotate(360deg) scale(1)}}
#num{font-size:40px;font-weight:700;line-height:1;text-shadow:0 2px 0 #fff}
#num small{font-size:24px;opacity:.65}
.track{position:absolute;left:150px;right:30px;top:100px;height:26px;border-radius:99px;z-index:2;
 background:rgba(255,255,255,.75);border:2.5px solid #7b4bd1;overflow:hidden;box-shadow:inset 0 3px 6px rgba(90,40,160,.35)}
#fill{height:100%;width:0;border-radius:99px;position:relative;background:linear-gradient(90deg,#8f5bff,#d36bff 55%,#ff7fc8);box-shadow:0 0 14px rgba(200,90,255,.8);transition:width 1.5s cubic-bezier(.2,.9,.2,1)}
#fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s infinite}
@keyframes shine{to{transform:translateX(100%)}}
#pct{position:absolute;left:0;right:0;top:0;text-align:center;font-size:15px;line-height:21px;font-weight:700;color:#2d0f5c;text-shadow:0 0 4px #fff,0 0 4px #fff}
.star{position:absolute;left:0;top:6px;width:140px;height:140px;z-index:5;filter:drop-shadow(0 0 12px #fff) drop-shadow(0 6px 12px rgba(120,60,200,.7));animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}25%{transform:translateY(-8px) rotate(3deg) scale(1.06)}50%{transform:translateY(-3px) rotate(7deg) scale(1)}75%{transform:translateY(-9px) rotate(-2deg) scale(1.05)}}
.hrt{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.22)}28%{transform:scale(.95)}}
.tw{position:absolute;width:20px;height:20px;background:#fff;z-index:6;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 6px #f0a8ff);animation:twk 2s ease-in-out infinite;opacity:0}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
.pop{animation:pop .9s cubic-bezier(.3,1.6,.4,1)!important}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-12deg)}100%{transform:scale(1)}}
.ring{position:absolute;left:70px;top:76px;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 14px #e08bff;z-index:4;animation:rg 1s ease-out forwards}
@keyframes rg{to{transform:scale(8);opacity:0}}
.chip{position:absolute;left:100px;top:-14px;z-index:3;padding:8px 20px 8px 50px;border-radius:99px;background:linear-gradient(90deg,#ff7fc8,#a46bff);color:#fff;font-weight:700;font-size:24px;
 border:3px solid #fff;box-shadow:0 6px 18px rgba(130,60,200,.6);opacity:0;animation:chip 2.4s cubic-bezier(.3,1.4,.4,1) forwards;white-space:nowrap}
@keyframes chip{0%{opacity:0;transform:translateX(-60px) scale(.4)}18%{opacity:1;transform:translateX(0) scale(1.1)}28%{transform:scale(1)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.done #fill{background:linear-gradient(90deg,#ffc85f,#ff8fd0,#a46bff)}
#ctl{position:fixed;left:40px;bottom:30px;z-index:99;display:flex;gap:10px;font-family:sans-serif}
#ctl button{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#ff7fc8,#8f5bff);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#ctl input{border:0;border-radius:14px;padding:0 14px;width:150px;font-size:18px;font-family:sans-serif;outline:0}
#ctl button.g{background:#555;padding:14px 16px}

#thanks{position:absolute;left:40px;top:215px;z-index:20;display:flex;align-items:center;gap:6px;pointer-events:none;opacity:0;transform:translateY(-20px) scale(.6);transform-origin:left top;transition:opacity .4s,transform .6s cubic-bezier(.3,1.5,.4,1)}
#thanks.show{opacity:1;transform:none}
#thanks img{width:230px;height:230px;filter:drop-shadow(0 8px 14px rgba(90,40,160,.55))}
#thanks .tx{display:flex;flex-direction:column;gap:4px;padding:14px 26px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(240,225,255,.75));border:2.5px solid #fff;box-shadow:0 10px 30px rgba(110,60,190,.45),0 0 0 2px rgba(150,100,230,.35)}
#ty{font-size:46px;font-weight:700;color:#3a1670;white-space:nowrap;letter-spacing:.04em}
#ty .l{display:inline-block;animation:wave 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.1s)}
#who{font-size:26px;font-weight:700;color:#a03bd8;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
#bar{position:absolute;inset:0}
#goalmsg{position:fixed;left:0;right:0;top:44%;text-align:center;z-index:70;pointer-events:none;font-size:min(9vw,120px);line-height:1.1;padding:0 3vw;font-weight:700;opacity:0;letter-spacing:.04em}
#goalmsg .l{display:inline-block;color:#fff;animation:wave2 1s ease-in-out infinite;animation-delay:calc(var(--i)*.07s);text-shadow:0 0 18px #ff8be8,0 0 40px #a46bff,0 5px 0 #7b4bd1,0 8px 18px rgba(60,20,120,.6)}
@keyframes wave2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.15) rotate(-5deg)}}
#flash{position:fixed;inset:0;z-index:65;pointer-events:none;opacity:0;background:radial-gradient(circle at 110px 116px,#fff,rgba(255,200,255,.55) 35%,transparent 70%)}
</style></head>
<body>
<canvas id="fx"></canvas>
<div id="wrap">
 <div id="bar"><div class="glass"></div>
 <div class="top"><span id="title">sub goal</span><span id="num">0<small> / 10</small></span></div>
 <div class="track"><div id="fill"></div><div id="pct">0%</div></div></div>
 <i class="tw" style="left:-6px;top:10px;animation-delay:0s"></i><i class="tw" style="left:112px;top:0px;animation-delay:0.6s"></i><i class="tw" style="left:122px;top:96px;animation-delay:1.2s"></i><i class="tw" style="left:4px;top:112px;animation-delay:1.7s"></i><i class="tw" style="left:60px;top:-8px;animation-delay:0.9s"></i><svg class="star" id="star" viewBox="0 0 100 100">
  <path d="M50 6 L61 34 L92 37 L68 57 L76 88 L50 71 L24 88 L32 57 L8 37 L39 34 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <g transform="translate(2.5,-2) scale(.95)"><path class="hrt" d="M50 66s-17-10-17-22c0-8 9-12 17-5 8-7 17-3 17 5 0 12-17 22-17 22z" fill="#ff7fc8" stroke="#b05bff" stroke-width="3"/></g>
 </svg>
</div>
<div id="thanks"><img id="dog" alt=""><div class="tx"><div id="ty"></div><div id="who"></div></div></div>
<div id="flash"></div><div id="goalmsg"></div>
<div id="ctl"><input id="tn" placeholder="test name"><button onclick="addSub(1,$('tn').value)">+1 sub (test)</button><button class="g" onclick="addSub(5,$('tn').value)">+5</button><button class="g" onclick="addSub(Math.max(1,GOAL-count),$('tn').value)">goal!</button><button class="g" onclick="const g=$('tn').value||'tester';giftBomb(g,10);for(let i=0;i<10;i++)setTimeout(()=>oneSub('x',g),300+i*250)">gift 10</button><button class="g" onclick="addSub(-1)">−1</button><button class="g" onclick="resetSubs()">reset</button></div>
<script>
/* =====================================================================
   SUB GOAL OVERLAY  -  single file, no build step, made for OBS Browser Source
   =====================================================================

   1) CONFIG ........ every setting in one place (can also come from the URL)
   2) STATE ......... count / goal (persisted in localStorage)
   3) PUBLIC API .... functions your own code / backend can call (see bottom)
   4) EVENT SOURCES . Streamlabs, StreamElements, postMessage  (plug yours here)

   HOW TO MAKE IT DYNAMIC
   ----------------------
   Anything that should change at runtime is a plain value in CONFIG or a
   function in the PUBLIC API:
     - a new subscriber        ->  addSub(1, 'UserName')
     - a gift bomb (N subs)    ->  giftBomb('GifterName', N)   (+ oneSub() per recipient)
     - change the goal number  ->  setGoal(50)
     - change the counter      ->  setCount(12)
     - change the title        ->  setTitle('sub goal')  or  setTitle('هدف ساب')
     - change any text/timing  ->  CONFIG.thanks = '...';  CONFIG.someone = '...';
   Names you pass in are shown on the "thank you" card ("someone" if empty).
   ===================================================================== */

/* ---------- 1) CONFIG ----------  (URL example: ?goal=50&title=sub%20goal&next=25)
   EN: every value can be overridden from the URL query string.
   FA: همه‌ی مقدارها از طریق آدرس (query string) هم قابل تغییرن. */
const q=new URLSearchParams(location.search);
const toInt=(value,fallback,min=0)=>{
 const n=Number(value);
 return Number.isFinite(n)&&Number.isInteger(n)&&n>=min?n:fallback;
};
const urlGoal=toInt(q.get('goal'),10,1);
const urlNext=q.has('next')?toInt(q.get('next'),urlGoal,0):urlGoal;
const urlStart=q.has('start')?toInt(q.get('start'),0,0):null;
const CONFIG={
 goal:      urlGoal,                                  // ?goal=   first goal (number of subs; must be >= 1)
 next:      urlNext,                                  // ?next= added to the goal each time (0 = restart, keep leftover)
 start:     urlStart,                                 // ?start=  force starting count (non-negative integer)
 title:     q.get('title')||'sub goal',               // ?title=  label shown on the bar
 thanks:    q.get('thanks')||'thank you!',            // ?thanks= big text on the thank-you card
 someone:   q.get('someone')||'someone',              // ?someone= fallback name if no username is known
 goalMsg:   q.get('goalmsg')||'GOAL REACHED!',        // ?goalmsg= text in the middle of the screen when the goal is reached
 thankMs:   4200,                                     // how long each thank-you card stays (ms)
 maxQueue:  6,                                        // max thank-you cards waiting in line
 giftWaitMs:6000,                                     // wait for individual gift-recipient events (ms)
 hideButtons: !!(window.obsstudio||q.has('nobtn')),   // hide test buttons in OBS or when ?nobtn is present
 streamlabsToken:     q.get('sl')||'',                // ?sl= Streamlabs Socket API token
 streamelementsToken: q.get('se')||'',                // ?se= StreamElements JWT token
 allowedOrigins: (q.get('origins')||'').split(',').map(v=>v.trim()).filter(Boolean) // explicit postMessage origins, e.g. ?origins=https://example.com or ?origins=null
};

/* ---------- 2) STATE ---------- */
const KEY='subgoal_count', $=id=>document.getElementById(id);
function readStoredInt(key,fallback,min=0){
 try{const raw=localStorage.getItem(key);if(raw===null)return fallback;const n=Number(raw);return Number.isFinite(n)&&Number.isInteger(n)&&n>=min?n:fallback}catch(e){return fallback}
}
let BASE=CONFIG.goal;          // the first goal (reset goes back to this)
let GOAL=BASE;                 // the CURRENT goal (grows by CONFIG.next each time it is reached)
try{
 if(readStoredInt('subgoal_base',-1,1)===BASE)GOAL=readStoredInt('subgoal_goal',BASE,1);
 localStorage.setItem('subgoal_base',BASE);
}catch(e){}

// Title: letters animate one by one (Persian is animated per word so the letters stay joined)
function setTitle(t){CONFIG.title=t;const el=$('title');el.textContent='';
 const fa=/[\u0600-\u06FF]/.test(t);
 (fa?t.split(' '):[...t]).forEach((c,i)=>{const sp=document.createElement('span');sp.className='l';sp.style.setProperty('--i',i);sp.textContent=c===' '?' ':c;el.appendChild(sp);if(fa)el.appendChild(document.createTextNode(' '))})}
setTitle(CONFIG.title);
let count=CONFIG.start!==null?CONFIG.start:readStoredInt(KEY,0,0);   // current number of subs
if(CONFIG.hideButtons)$('ctl').style.display='none';
// render(): redraws bar, % and counter from count/GOAL and saves them. Call it after changing count or GOAL.
function render(){
 const p=Math.min(count/GOAL*100,100);
 $('fill').style.width=p+'%';$('pct').textContent=Math.round(p)+'%';
 $('num').innerHTML=count+'<small> / '+GOAL+'</small>';
 document.body.classList.toggle('done',count>=GOAL);
 try{localStorage.setItem(KEY,count);localStorage.setItem('subgoal_goal',GOAL)}catch(e){}
}
/* ---------- VISUAL EFFECTS: canvas particles (hearts, pixel hearts, sparkles, confetti) ----------
   Everything is drawn with canvas paths - no emoji/fonts, so it renders the same on every PC.
   hearts(n) / confetti(n) spawn particles; loop() animates them.  Safe to restyle: colors are the HEARTS / COL arrays. */
const cv=$('fx'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
const HEARTS=['#a46bff','#ff7fc8','#ff5fa8','#c98bff','#ff9fd6'],COL=['#ff7fc8','#a46bff','#ffd25f','#6fe0ff','#fff','#7dffb3'];
function heart(x,y,s,c){const r=s/2;cx.save();cx.translate(x,y);cx.fillStyle=c;cx.strokeStyle='#fff';cx.lineWidth=Math.max(2,s*.09);cx.lineJoin='round';
 cx.beginPath();cx.moveTo(0,r*.9);cx.bezierCurveTo(-r*1.4,r*.05,-r*.75,-r*.95,0,-r*.35);cx.bezierCurveTo(r*.75,-r*.95,r*1.4,r*.05,0,r*.9);cx.closePath();cx.fill();cx.stroke();
 cx.fillStyle='rgba(255,255,255,.7)';cx.beginPath();cx.ellipse(-r*.45,-r*.2,r*.18,r*.1,-.6,0,6.3);cx.fill();cx.restore()}
function spark(x,y,s,c){const r=s/2;cx.save();cx.translate(x,y);cx.fillStyle=c;cx.shadowColor=c;cx.shadowBlur=10;cx.beginPath();
 for(let i=0;i<8;i++){const a=i*Math.PI/4,d=i%2?r*.3:r;cx.lineTo(Math.cos(a)*d,Math.sin(a)*d)}cx.closePath();cx.fill();cx.restore()}
const PH=['.OOO.OOO.','OHHFOFFFO','OHFFFFFFO','OFFFFFFFO','.OFFFFFO.','..OFFFO..','...OFO...','....O....'];
function pheart(x,y,s,c){const u=Math.max(2,Math.round(s/9));cx.save();cx.translate(Math.round(x),Math.round(y));
 PH.forEach((row,j)=>{for(let i=0;i<9;i++){const k=row[i];if(k==='.')continue;cx.fillStyle=k==='O'?'#3a1670':k==='H'?'#fff':c;cx.fillRect((i-4.5)*u,(j-4)*u,u,u)}});cx.restore()}
function pspark(x,y,s,c){const u=Math.max(2,Math.round(s/5));cx.save();cx.translate(Math.round(x),Math.round(y));cx.fillStyle=c;
 [[0,-2],[0,-1],[0,0],[0,1],[0,2],[-2,0],[-1,0],[1,0],[2,0]].forEach(p=>cx.fillRect((p[0]-.5)*u,(p[1]-.5)*u,u,u));cx.restore()}
function hearts(n){for(let i=0;i<n;i++){P.push({t:'h',px:Math.random()<.4,e:HEARTS[i%5],x:Math.random()*cv.width,y:cv.height+40,vy:-(2.5+Math.random()*3.5),a:Math.random()*6,w:.03+Math.random()*.04,s:26+Math.random()*34,life:1})}}
function confetti(n){for(let i=0;i<n;i++){P.push({t:'c',x:Math.random()*cv.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COL[i%COL.length],w:10+Math.random()*8,h:6+Math.random()*6,life:1})}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(p=>{
  if(p.t==='f'){p.y+=p.vy;p.x+=p.vx;p.life-=.025;cx.globalAlpha=Math.max(p.life,0);p.sp?(p.px?pspark:spark)(p.x,p.y,p.s,p.e):(p.px?pheart:heart)(p.x,p.y,p.s,p.e);return p.life>0}
  if(p.t==='h'){p.y+=p.vy;p.a+=p.w;p.x+=Math.sin(p.a)*2;if(p.y<cv.height*.3)p.life-=.02;
   cx.globalAlpha=Math.max(p.life,0);(p.px?pheart:heart)(p.x,p.y,p.s,p.e);return p.life>0&&p.y>-60}
  p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height*.8)p.life-=.03;
  cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.r*2));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  return p.life>0});
 requestAnimationFrame(loop)}loop();

/* ---------- THANK-YOU CARD + SUB GIF ----------
   DOG = the animated sub-gif (transparent animated WebP, embedded as base64).

/* ================= GOAL REACHED SEQUENCE =================
   goalAnim() runs automatically when count >= GOAL:
     1 star charge -> 2 flash + shockwaves + confetti + glass shatters -> 3 dog runs + big message -> 4 widget rebuilds with the next goal
   It is safe to call goalAnim() yourself for testing.  Timings are the sleep(...) values inside it. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let playing=false;
function shatter(){
 const wrap=$('wrap'),bar=$('bar');
 if(!wrap||!bar)return;
 const X0=60,X1=640,Y0=22,Y1=142,C=6,R=2,pts=[];
 for(let j=0;j<=R;j++){
  pts[j]=[];
  for(let i=0;i<=C;i++){
   const edge=i===0||i===C||j===0||j===R;
   pts[j][i]=[X0+(X1-X0)*i/C+(edge?0:(Math.random()-.5)*28),Y0+(Y1-Y0)*j/R+(edge?0:(Math.random()-.5)*20)];
  }
 }
 const tris=[];
 for(let j=0;j<R;j++)for(let i=0;i<C;i++){
  const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i+1],d=pts[j+1][i];
  tris.push([a,b,c],[a,c,d]);
 }
 const mid=(X0+X1)/2,frag=document.createDocumentFragment();
 tris.forEach(t=>{
  // Keep the browser's original CSS selectors; avoid expensive getComputedStyle() copying.
  const sh=bar.cloneNode(true);
  sh.classList.add('goal-shard');
  sh.removeAttribute('id');
  sh.style.position='absolute';sh.style.left='0';sh.style.top='0';
  sh.style.right='auto';sh.style.bottom='auto';sh.style.width='100%';sh.style.height='100%';
  sh.style.margin='0';sh.style.pointerEvents='none';sh.style.overflow='hidden';sh.style.willChange='transform,opacity';
  // Stop nested text and progress animations in each shard to reduce work during the explosion.
  sh.querySelectorAll('*').forEach(el=>{el.style.animation='none';el.style.transition='none'});
  sh.style.clipPath='polygon('+t.map(p=>p[0]+'px '+p[1]+'px').join(',')+')';
  const cxp=(t[0][0]+t[1][0]+t[2][0])/3,cyp=(t[0][1]+t[1][1]+t[2][1])/3;
  sh.style.transformOrigin=cxp+'px '+cyp+'px';
  frag.appendChild(sh);
  const dx=(cxp-mid)*(.6+Math.random()*.8),rot=(Math.random()-.5)*420,dl=Math.random()*180,duration=1250;
  try{
   const anim=sh.animate([
    {transform:'translate(0,0) rotate(0deg)',opacity:1,offset:0},
    {transform:`translate(${dx*.25}px,-24px) rotate(${rot*.2}deg)`,opacity:1,offset:.2},
    {transform:`translate(${dx}px,${Math.max(250,innerHeight*.75)}px) rotate(${rot}deg)`,opacity:0}
   ],{duration,delay:dl,easing:'cubic-bezier(.4,0,.9,.7)',fill:'forwards'});
   anim.onfinish=()=>sh.remove();
   anim.oncancel=()=>sh.remove();
   // Safety cleanup in case an OBS/browser animation event is throttled.
   setTimeout(()=>sh.remove(),dl+duration+500);
  }catch(err){sh.remove();console.warn('[Sub Goal] Could not animate a shard:',err)}
 });
 wrap.appendChild(frag);
}
function runDog(){
 const im=document.createElement('img');im.className='goal-dog';im.src=DOG;const sz=Math.min(260,innerWidth*.22);im.style.cssText='position:fixed;left:0;top:0;width:'+sz+'px;height:'+sz+'px;z-index:60;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(90,40,160,.55))';document.body.appendChild(im);
 const t0=performance.now(),D=3200,baseY=innerHeight*.62,E=['#a46bff','#ff7fc8','#ffd25f','#fff','#ff5fa8'];let last=0;
 (function f(now){const t=(now-t0)/D;if(t>=1){im.remove();return}
  const x=-300+(innerWidth+400)*t,y=baseY-Math.abs(Math.sin(t*D/1000*9))*45;im.style.transform=`translate(${x}px,${y}px) rotate(${Math.sin(t*D/1000*9)*4}deg)`;
  if(now-last>45){last=now;P.push({t:'f',e:E[Math.random()*5|0],sp:Math.random()<.45,px:Math.random()<.5,x:x+30,y:y+170+Math.random()*60,vx:-1-Math.random()*2,vy:-.4-Math.random(),s:24+Math.random()*26,life:1})}
  requestAnimationFrame(f)})(t0)
}
function goalMsg(){const g=$('goalmsg');words(g,CONFIG.goalMsg);
 g.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1.15)',offset:.12},{opacity:1,transform:'scale(1)',offset:.2},{opacity:1,transform:'scale(1)',offset:.85},{opacity:0,transform:'scale(1.3)'}],{duration:3400,fill:'none'});}
async function goalAnim(){
 if(playing)return;
 playing=true;
 const bar=$('bar'),star=$('star'),flash=$('flash'),goal=$('goalmsg');
 let completed=false;
 try{
  // 1) Supernova charge
  const sh=[];
  for(let i=0;i<10;i++)sh.push({transform:`scale(${1+i*.075}) rotate(${i%2?9:-9}deg)`,filter:`drop-shadow(0 0 ${12+i*5}px #ff8be8) brightness(${1+i*.1})`});
  sh.push({transform:'scale(1.8) rotate(0deg)',filter:'drop-shadow(0 0 60px #fff) brightness(2)'});
  star.animate(sh,{duration:1200,fill:'forwards'});
  const glow=bar.animate([{filter:'none'},{filter:'brightness(1.4) drop-shadow(0 0 28px #ff8be8)'}],{duration:1200,fill:'forwards'});
  await sleep(1200);

  // 2) Explosion: short-lived shards are lightweight and automatically cleaned up.
  const sr=star.getBoundingClientRect(),c0={x:sr.left+sr.width/2,y:sr.top+sr.height/2};
  flash.style.background=`radial-gradient(circle at ${c0.x}px ${c0.y}px,#fff,rgba(255,200,255,.55) 35%,transparent 70%)`;
  flash.animate([{opacity:0},{opacity:1,offset:.15},{opacity:0}],{duration:900});
  for(let i=0;i<3;i++){
   const r=document.createElement('div');r.className='goal-ring';
   r.style.cssText='position:fixed;left:'+(c0.x-10)+'px;top:'+(c0.y-10)+'px;width:20px;height:20px;border:6px solid #fff;border-radius:50%;box-shadow:0 0 24px #e08bff;z-index:64;pointer-events:none';
   document.body.appendChild(r);
   r.animate([{transform:'scale(1)',opacity:1},{transform:'scale('+Math.max(40,innerWidth/10)+')',opacity:0}],{duration:1100,delay:i*140,easing:'ease-out',fill:'both'}).onfinish=()=>r.remove();
  }
  star.animate([{transform:'scale(1.8)',opacity:1},{transform:'scale(3.2)',opacity:0}],{duration:450,fill:'forwards'});
  hearts(30);confetti(100);
  glow.cancel();
  shatter();bar.style.visibility='hidden';
  await sleep(1000);

  // 3) Celebration message
  runDog();goalMsg();hearts(16);
  await sleep(3600);

  // 4) Restore widget for the next goal.
  do{
   if(CONFIG.next>0)GOAL+=CONFIG.next;
   else count=Math.max(0,count-GOAL);
  }while(count>=GOAL);
  const fl=$('fill');fl.style.transition='none';render();void fl.offsetWidth;fl.style.transition='';
  star.getAnimations().forEach(a=>{if(!(window.CSSAnimation&&a instanceof CSSAnimation))a.cancel()});
  bar.style.visibility='visible';
  bar.animate([{transform:'scale(.4)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:800,easing:'cubic-bezier(.3,1.4,.4,1)'});
  star.style.opacity='';star.style.filter='';
  star.animate([{transform:'scale(0) rotate(-90deg)',opacity:0},{transform:'scale(1.25) rotate(8deg)',opacity:1,offset:.6},{transform:'scale(1) rotate(0deg)',opacity:1}],{duration:800,easing:'ease-out'});
  hearts(10);confetti(35);
  completed=true;
 }catch(err){
  console.error('[Sub Goal] Goal animation failed; restoring overlay.',err);
 }finally{
  if(!completed){
   document.querySelectorAll('.goal-shard,.goal-ring,.goal-dog').forEach(el=>el.remove());
   star.getAnimations().forEach(a=>{if(!(window.CSSAnimation&&a instanceof CSSAnimation))a.cancel()});
   bar.getAnimations().forEach(a=>a.cancel());
   flash.getAnimations().forEach(a=>a.cancel());goal.getAnimations().forEach(a=>a.cancel());
   bar.style.visibility='visible';bar.style.filter='';bar.style.transform='';bar.style.opacity='';
   star.style.opacity='';star.style.transform='';star.style.filter='';
   flash.style.opacity='0';goal.style.opacity='0';
   render();
  }
  playing=false;
 }
}
/* ================= PUBLIC API =================
   These are plain global functions - call them from your own script, the browser console, an OBS dock,
   or via window.postMessage (see EVENT SOURCES).  They are the ONLY things you need to wire up your data.

   addSub(n=1, name='', quiet=false)  add n subs.  name -> thank-you card.  quiet=true -> no card (used internally for gift recipients)
   giftBomb(gifterName, amount)       gift of `amount` subs: ONE card + counts exactly `amount` (see oneSub)
   oneSub(recipientName, gifterName)  one gifted/normal sub. If gifterName belongs to a running giftBomb it is counted inside it (no double count)
   setGoal(n)  setCount(n)  setTitle(text)  resetSubs()
   ================================================ */
function celebrate(label){
 hearts(22);confetti(70);
 const T=$('title');T.classList.remove('fast');void T.offsetWidth;T.classList.add('fast');
 const w=$('wrap'),r=document.createElement('i');r.className='ring';w.appendChild(r);setTimeout(()=>r.remove(),1100);
 if(label!==null){const c=document.createElement('div');c.className='chip';c.textContent=label||'+1 sub 💜';w.appendChild(c);setTimeout(()=>c.remove(),2500)}
 const s=$('star');s.classList.remove('pop');void s.getBoundingClientRect();s.classList.add('pop');
}
let lastFx=0;
window.addSub=(n=1,name='',quiet=false)=>{
 const delta=Number(n);
 if(!Number.isFinite(delta)||!Number.isInteger(delta)||delta===0)return;
 const displayName=String(name??'').trim();
 count=Math.max(0,count+delta);render();
 if(delta>0){
  const now=Date.now();if(now-lastFx>700){lastFx=now;celebrate(quiet?null:'+'+delta+(delta>1?' subs':' sub')+' 💜')}
  if(!quiet)thank(delta>1?(displayName||CONFIG.someone)+' gifted '+delta+' subs':(displayName||CONFIG.someone));
  if(count>=GOAL)goalAnim();
 }
};
// Each gift batch has its own record. Late recipient events are temporarily remembered to reduce double counting.
const pendingGifts=new Map();
const giftKey=name=>String(name??'').trim().toLocaleLowerCase();
function removeGiftBatch(key,batch){
 if(batch.timer)clearTimeout(batch.timer);
 if(batch.cleanup)clearTimeout(batch.cleanup);
 const queue=pendingGifts.get(key);
 if(!queue)return;
 const i=queue.indexOf(batch);if(i!==-1)queue.splice(i,1);
 if(!queue.length)pendingGifts.delete(key);
}
window.giftBomb=(gifter,amount)=>{
 const giverName=String(gifter??'').trim()||CONFIG.someone;
 const total=toInt(amount,1,1);
 const key=giftKey(giverName),queue=pendingGifts.get(key)||[];
 const batch={gifter:giverName,left:total,lateToIgnore:0,timer:null,cleanup:null};
 queue.push(batch);pendingGifts.set(key,queue);
 lastFx=Date.now();celebrate('+'+total+' subs 💜');thank(giverName+' gifted '+total+' subs');
 batch.timer=setTimeout(()=>{
  batch.timer=null;
  if(batch.left>0){
   const missing=batch.left;batch.left=0;batch.lateToIgnore=missing;
   addSub(missing,'',true);
   // Keep a short-lived record so delayed recipient events do not immediately count a second time.
   batch.cleanup=setTimeout(()=>removeGiftBatch(key,batch),Math.max(60000,CONFIG.giftWaitMs*5));
  }else removeGiftBatch(key,batch);
 },CONFIG.giftWaitMs);
};
window.oneSub=(name,gifter)=>{
 const key=giftKey(gifter),queue=key?pendingGifts.get(key):null;
 if(queue&&queue.length){
  while(queue.length){
   const batch=queue[0];
   if(batch.left>0){
    batch.left--;addSub(1,'',true);
    if(batch.left===0)removeGiftBatch(key,batch);
    return;
   }
   if(batch.lateToIgnore>0){
    batch.lateToIgnore--;
    if(batch.lateToIgnore===0)removeGiftBatch(key,batch);
    return;
   }
   removeGiftBatch(key,batch);
  }
 }
 if(gifter)addSub(1,String(gifter));else addSub(1,String(name??''));
};

window.resetSubs=()=>{count=0;GOAL=BASE;render()};                 // back to 0 and the first goal
window.setGoal=(n)=>{GOAL=toInt(n,GOAL,1);render()};          // change the CURRENT goal (e.g. setGoal(50))
window.setBaseGoal=(n)=>{BASE=toInt(n,BASE,1);GOAL=BASE;render()}; // change the first goal that reset returns to
window.setCount=(n)=>{count=toInt(n,0,0);render();if(count>=GOAL)goalAnim()}; // set the counter directly (no per-sub effects)
window.setTitle=setTitle;
// Keyboard shortcuts work only when focus is not inside an editable control.
addEventListener('keydown',e=>{
 const target=e.target;
 if(target&&(target.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const key=String(e.key||'').toLowerCase();
 if(key==='+'||key==='='){e.preventDefault();addSub(1)}
 else if(key==='-'){e.preventDefault();addSub(-1)}
 else if(key==='r'){resetSubs()}
});
/* ================= EVENT SOURCES =================
   Plug your own data in here. Whatever the source is, it only has to call the PUBLIC API above:
       new sub          -> oneSub(username)
       gift of N subs   -> giftBomb(gifterName, N)          (then oneSub(recipient, gifterName) for each recipient, if you have them)
   A) Streamlabs  (?sl=SOCKET_TOKEN)         B) StreamElements (?se=JWT)         C) postMessage (below)  D) your own: copy A or B.

   C) postMessage - lets ANOTHER page/tab (e.g. an OBS dock control panel, or your backend page) drive this overlay:
        overlayWindow.postMessage({type:'sub',  name:'Ali'}, '*')
        overlayWindow.postMessage({type:'gift', gifter:'Sara', amount:10}, '*')
        overlayWindow.postMessage({type:'setGoal', value:50}, '*')    // also: setCount, setTitle, reset
        overlayWindow.postMessage({type:'config', values:{thanks:'ممنون!', someone:'دوست عزیز'}}, '*')
   postMessage origins are blocked unless listed explicitly in ?origins=... . For a local file sender, use ?origins=null. */
addEventListener('message',e=>{
 if(!CONFIG.allowedOrigins.includes(e.origin))return;
 const m=e.data;
 if(!m||typeof m!=='object')return;
 if(m.type==='sub')oneSub(m.name,m.gifter);
 else if(m.type==='gift')giftBomb(m.gifter,m.amount);
 else if(m.type==='setGoal')setGoal(m.value);
 else if(m.type==='setCount')setCount(m.value);
 else if(m.type==='setTitle')setTitle(String(m.value??''));
 else if(m.type==='reset')resetSubs();
 else if(m.type==='config'&&m.values&&typeof m.values==='object'){
  if(typeof m.values.thanks==='string')CONFIG.thanks=m.values.thanks;
  if(typeof m.values.someone==='string')CONFIG.someone=m.values.someone;
  if(typeof m.values.goalMsg==='string')CONFIG.goalMsg=m.values.goalMsg;
  if(typeof m.values.title==='string')setTitle(m.values.title);
 }
});

// ---- A + B: socket integrations ----
function load(src,cb){const s=document.createElement('script');s.src=src;s.onload=cb;document.head.appendChild(s)}
const SIO='https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js';
if(CONFIG.streamlabsToken)load(SIO,()=>{const s=io('https://sockets.streamlabs.com?token='+CONFIG.streamlabsToken,{transports:['websocket']});
 s.on('event',e=>{if(e.type!=='subscription')return;(e.message||[{}]).forEach(m=>{const t=m.sub_type||'';
  if(t==='submysterygift'||t==='community_gift')giftBomb(m.gifter||m.name,m.amount||m.gift_count||1);else oneSub(m.name,m.gifter)})})});
if(CONFIG.streamelementsToken)load(SIO,()=>{const s=io('https://realtime.streamelements.com',{transports:['websocket']});
 s.on('connect',()=>s.emit('authenticate',{method:'jwt',token:CONFIG.streamelementsToken}));
 s.on('event',e=>{if(e.type!=='subscriber')return;const d=e.data||{};
  if(d.bulkGifted)giftBomb(d.sender||d.username,d.amount);else oneSub(d.username,d.gifted?d.sender:'')})});
render();
</script></body></html>
